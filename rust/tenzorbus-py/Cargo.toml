[package]
name = "tenzorbus-py"
version = "0.1.0-alpha.0"
edition = "2024"
license = "BUSL-1.1"
publish = false

[lib]
name = "tenzorbus_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
tenzorbus = { path = "../tenzorbus" }
tenzor-core = { path = "../tenzor-core" }
