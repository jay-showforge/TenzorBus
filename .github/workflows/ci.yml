name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core tests (clean clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Keep CI on the same pinned release toolchain used by final verification.
      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build maturin numpy pyarrow pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install cargo-deny 0.20.2
        uses: taiki-e/install-action@347438fa49c6c030ac9a8f98ea84f0e151483e84
        with:
          tool: cargo-deny@0.20.2

      - name: Build the workspace and the extension module
        run: scripts/build_rust.sh

      - name: Rust tests (layout parity, golden bytes, transport invariants, kill tests)
        working-directory: rust
        run: cargo test --release

      - name: Python tests (reference + Rust bindings + TenzorPipe integration)
        run: scripts/run_tests.sh

      - name: Benchmark harness regression tests
        run: python -m unittest tests.test_benchmark_harness -v

      - name: ThreadSanitizer (clean run plus positive control)
        run: scripts/run_tsan.sh

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatting
        working-directory: rust
        run: cargo fmt --all --check

      - name: Dependency license policy
        working-directory: rust
        run: cargo deny check licenses

      - name: Build Python release assets
        run: |
          python scripts/update_source_checksums.py --check
          python scripts/verify_authoritative_epyc.py
          python -m build

  arm64-native:
    name: native Linux ARM64 runtime and wheel
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy

      - name: Python build and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build maturin numpy pyarrow

      - name: Native TenzorPipe build dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm ffmpeg

      - name: Native Rust, Python API/lifetime, and clean-wheel validation
        run: bash scripts/run_native_arm64_validation.sh

      - name: Build supported TenzorPipe v0.3.2 natively
        run: |
          git clone --depth 1 --branch v0.3.2 https://github.com/jay-showforge/tenzorpipe /tmp/tenzorpipe-arm64
          git -C /tmp/tenzorpipe-arm64 apply "$GITHUB_WORKSPACE/patches/tenzorpipe-v0.3.2-direct-write.patch"
          pip install /tmp/tenzorpipe-arm64
          cargo build --release --locked --manifest-path /tmp/tenzorpipe-arm64/Cargo.toml
          TENZORPIPE_DIR=/tmp/tenzorpipe-arm64 scripts/build_bridge.sh
          scripts/build_rust.sh

      - name: Real TenzorPipe to TenzorBus to consumer flow on ARM64
        env:
          TENZORBUS_NATIVE_ARM64_TENZORPIPE: "1"
          TENZORBUS_NATIVE_ARM64_TENZORPIPE_REPORT: ${{ github.workspace }}/dist-arm64/arm64-tenzorpipe-integration.json
          TENZORPIPE_BIN: /tmp/tenzorpipe-arm64/target/release/tenzor
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -o pipefail
          python tests/test_live_direct_write.py -v \
            LiveDirectWriteTests.test_native_arm64_real_tenzorpipe_to_numpy_consumer \
            2>&1 | tee dist-arm64/arm64-tenzorpipe-integration.log
          test -s dist-arm64/arm64-tenzorpipe-integration.json

      - name: Upload the runtime-validated ARM64 wheel and results
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-wheel
          if-no-files-found: error
          path: |
            dist-arm64/tenzorbus_py-0.1.0a2-cp311-abi3-manylinux_2_34_aarch64.whl
            dist-arm64/ARM64_SHA256SUMS
            dist-arm64/arm64-validation.json
            dist-arm64/arm64-unittest.log
            dist-arm64/arm64-tenzorpipe-integration.json
            dist-arm64/arm64-tenzorpipe-integration.log

  media-integration:
    name: real TenzorPipe v0.3.2 integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy
      - run: sudo apt-get update && sudo apt-get install -y nasm ffmpeg
      - run: pip install build maturin numpy pyarrow pytest
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install cargo-deny 0.20.2
        uses: taiki-e/install-action@347438fa49c6c030ac9a8f98ea84f0e151483e84
        with:
          tool: cargo-deny@0.20.2
      # The integration is only real if it runs the real engine. Build TenzorPipe
      # from its v0.3.2 tag, with the direct-write patch, rather than
      # substituting a fixture.
      - name: Build TenzorPipe v0.3.2 with the direct-write patch
        run: |
          git clone --depth 1 --branch v0.3.2 https://github.com/jay-showforge/tenzorpipe /tmp/tenzorpipe
          git -C /tmp/tenzorpipe apply "$GITHUB_WORKSPACE/patches/tenzorpipe-v0.3.2-direct-write.patch"
          pip install /tmp/tenzorpipe
          echo "TENZORPIPE_DIR=/tmp/tenzorpipe" >> "$GITHUB_ENV"
          echo "TENZORPIPE_BIN=/tmp/tenzorpipe/target/release/tenzor" >> "$GITHUB_ENV"
      # A pristine build of the same tag, so the byte-identity claim about the
      # .tenzor path is checked rather than asserted.
      - name: Build a pristine v0.3.2 for the byte-identity gate
        run: |
          git clone --depth 1 --branch v0.3.2 https://github.com/jay-showforge/tenzorpipe /tmp/tenzorpipe-pristine
          cargo build --release --locked --manifest-path /tmp/tenzorpipe-pristine/Cargo.toml
          echo "PRISTINE_TENZOR=/tmp/tenzorpipe-pristine/target/release/tenzor" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --manifest-path /tmp/tenzorpipe/Cargo.toml
      - name: Build the exact release asset set
        run: scripts/build_release_assets.sh
      - name: Every release-candidate gate
        env:
          RELEASE_ASSETS_DIR: ${{ github.workspace }}/dist
          # This native x86-64 job validates its own wheel. The separately
          # required arm64-native job builds and runs the ARM64 wheel on ARM64.
          RELEASE_WHEEL_ARCHES: x86_64
        run: scripts/verify_release_candidate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            release_candidate_gates.json
            integration_soak_results.json
            live_soak_results.json
            tsan_results.json
            benchmark_matrix.json

  soak:
    name: stress soaks
    runs-on: ubuntu-latest
    # Minutes, not seconds. Keep it off every push.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: pip install numpy
      - run: scripts/run_rust_stress.sh
      - run: PYTHONPATH=src benchmarks/benchmark_matrix.py run --output benchmark_matrix.json
      - uses: actions/upload-artifact@v4
        with:
          name: stress-and-benchmark-results
          path: |
            stress_rust_results.json
            benchmark_matrix.json
