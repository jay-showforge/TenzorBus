# Licence policy for TenzorBus, enforced by `cargo deny check licenses`.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
name = "tenzor-core"
version = "=0.1.0-alpha.2"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
name = "tenzorbus"
version = "=0.1.0-alpha.2"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
name = "tenzorbus-py"
version = "=0.1.0-alpha.2"
allow = ["BUSL-1.1"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
