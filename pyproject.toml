[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenzorbus"
version = "0.1.0a2"
description = "Tensor-native shared-memory IPC for local multi-consumer pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22"]
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{name = "Jonathan Tyler Montgomery"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://tenzorpipe.org"
Repository = "https://github.com/jay-showforge/TenzorBus"
Issues = "https://github.com/jay-showforge/TenzorBus/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pyarrow", "torch"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
